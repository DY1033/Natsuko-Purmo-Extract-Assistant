<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f5f7">
  <meta name="robots" content="noindex, nofollow">
  <title>{% block title %}解压码提取{% endblock %}</title>
  <script>
    /* 在样式加载前确定主题，避免首屏白/黑闪烁 */
    (function () {
      try {
        var t = localStorage.getItem('np-theme');
        if (t !== 'light' && t !== 'dark') {
          t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%232563eb'/><path d='M11 15v-3.5a5 5 0 0 1 10 0V15' stroke='white' stroke-width='2.6' fill='none'/><rect x='9' y='14' width='14' height='11' rx='2' fill='white'/></svg>">
  {% block head %}{% endblock %}
</head>
<body>
  {% block body %}{% endblock %}
  <div id="toasts"></div>

  <button type="button" class="theme-toggle" id="theme-toggle" title="切换日间/夜间" aria-label="切换日间/夜间主题">
    <svg class="ico-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    <svg class="ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2 12h2M20 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
  </button>
  <script>
    (function () {
      var btn = document.getElementById('theme-toggle');
      if (!btn) return;
      function metaColor(t) {
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', t === 'dark' ? '#12151b' : '#f4f5f7');
      }
      metaColor(document.documentElement.getAttribute('data-theme'));
      btn.addEventListener('click', function () {
        var cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
        var next = cur === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        try { localStorage.setItem('np-theme', next); } catch (e) {}
        metaColor(next);
        if (window.toast) window.toast(next === 'dark' ? '已切换到夜间模式' : '已切换到日间模式');
      });
    })();
  </script>

  <script>
    window.toast = function (msg, type) {
      var box = document.getElementById('toasts');
      var el = document.createElement('div');
      el.className = 'toast ' + (type || '');
      el.textContent = msg;
      box.appendChild(el);
      setTimeout(function () {
        el.style.opacity = '0';
        el.style.transition = 'opacity .2s';
        setTimeout(function () { el.remove(); }, 220);
      }, 2200);
    };

    window.copyText = async function (text, msg) {
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
        } else {
          var ta = document.createElement('textarea');
          ta.value = text;
          ta.style.position = 'fixed';
          ta.style.left = '-9999px';
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          ta.remove();
        }
        toast(msg || '已复制');
        return true;
      } catch (e) {
        toast('复制失败，请手动选中复制', 'err');
        return false;
      }
    };
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
