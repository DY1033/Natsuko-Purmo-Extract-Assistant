<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f5f7">
  <meta name="robots" content="noindex, nofollow">
  <title>{% block title %}解压码提取{% endblock %}</title>
  <script>
    /* 在样式加载前确定主题，避免首屏闪烁。支持 6 套主题。 */
    (function () {
      var VALID = ['light', 'dark', 'forest', 'amber', 'rose', 'ocean'];
      try {
        var t = localStorage.getItem('np-theme');
        if (VALID.indexOf(t) < 0) {
          t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%232563eb'/><path d='M11 15v-3.5a5 5 0 0 1 10 0V15' stroke='white' stroke-width='2.6' fill='none'/><rect x='9' y='14' width='14' height='11' rx='2' fill='white'/></svg>">
  {% block head %}{% endblock %}
</head>
<body>
  {% block body %}{% endblock %}
  <div id="toasts"></div>

  <div class="theme-picker" id="theme-picker">
    <button type="button" class="theme-toggle" id="theme-toggle" title="切换主题" aria-label="切换主题">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18c.8 0 1.2-.7 1.2-1.4 0-.9-.7-1.3-.7-2.1 0-.8.6-1.4 1.4-1.4H16a5 5 0 0 0 5-5c0-4.4-4-8-9-8z"/><circle cx="7.5" cy="11" r="1"/><circle cx="10" cy="7.5" r="1"/><circle cx="14.5" cy="7.8" r="1"/></svg>
    </button>
    <div class="theme-menu" id="theme-menu" role="menu"></div>
  </div>
  <script>
    (function () {
      var THEMES = [
        { id: 'light',  name: '极光白', color: '#2563eb', meta: '#f4f5f7' },
        { id: 'dark',   name: '曜石黑', color: '#5b8cff', meta: '#12151b' },
        { id: 'forest', name: '森林绿', color: '#157f47', meta: '#f1f6f2' },
        { id: 'amber',  name: '暖阳橙', color: '#b45309', meta: '#faf5ee' },
        { id: 'rose',   name: '玫瑰红', color: '#b3175b', meta: '#fbf3f5' },
        { id: 'ocean',  name: '深海蓝', color: '#38bdf8', meta: '#0b1524' }
      ];
      var root = document.documentElement;
      var btn = document.getElementById('theme-toggle');
      var menu = document.getElementById('theme-menu');
      if (!btn || !menu) return;

      function current() { return root.getAttribute('data-theme') || 'light'; }
      function metaColor(t) {
        var conf = THEMES.filter(function (x) { return x.id === t; })[0];
        var m = document.querySelector('meta[name="theme-color"]');
        if (m && conf) m.setAttribute('content', conf.meta);
      }
      function render() {
        var cur = current();
        menu.innerHTML = '';
        THEMES.forEach(function (x) {
          var b = document.createElement('button');
          b.type = 'button';
          b.className = 'theme-opt' + (x.id === cur ? ' active' : '');
          b.setAttribute('role', 'menuitem');
          var swatch = '<span class="swatch" style="background:' + x.color + '"></span>';
          var check = x.id === cur ? '<span class="theme-check">✓</span>' : '';
          b.innerHTML = swatch + '<span class="theme-name">' + x.name + '</span>' + check;
          b.addEventListener('click', function () {
            root.setAttribute('data-theme', x.id);
            try { localStorage.setItem('np-theme', x.id); } catch (e) {}
            metaColor(x.id);
            menu.classList.remove('open');
            if (window.toast) window.toast('已切换到「' + x.name + '」主题');
            render();
          });
          menu.appendChild(b);
        });
      }
      metaColor(current());
      render();
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        menu.classList.toggle('open');
      });
      document.addEventListener('click', function (e) {
        if (!document.getElementById('theme-picker').contains(e.target)) menu.classList.remove('open');
      });
    })();
  </script>

  <script>
    window.toast = function (msg, type) {
      var box = document.getElementById('toasts');
      var el = document.createElement('div');
      el.className = 'toast ' + (type || '');
      el.textContent = msg;
      box.appendChild(el);
      setTimeout(function () {
        el.style.opacity = '0';
        el.style.transition = 'opacity .2s';
        setTimeout(function () { el.remove(); }, 220);
      }, 2200);
    };

    window.copyText = async function (text, msg) {
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
        } else {
          var ta = document.createElement('textarea');
          ta.value = text;
          ta.style.position = 'fixed';
          ta.style.left = '-9999px';
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          ta.remove();
        }
        toast(msg || '已复制');
        return true;
      } catch (e) {
        toast('复制失败，请手动选中复制', 'err');
        return false;
      }
    };
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
